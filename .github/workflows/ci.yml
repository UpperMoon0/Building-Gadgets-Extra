name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run shared tests
        run: |
          chmod +x ./gradlew
          ./gradlew -p common test --no-daemon --no-configuration-cache

  versions:
    name: Verify ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Forge 1.16.5
            java: '21'
            working-directory: .
            command: ./gradlew :forge-1.16.5:build --configure-on-demand --no-daemon --no-configuration-cache
          - name: Forge 1.20.1 + GameTest
            java: '21'
            working-directory: .
            command: ./gradlew :forge-1.20.1:build :forge-1.20.1:runGameTestServer --no-daemon --no-configuration-cache
          - name: NeoForge 1.21.1 + GameTest
            java: '21'
            working-directory: .
            command: ./gradlew :neoforge-1.21.1:build :neoforge-1.21.1:runGameTestServer --configure-on-demand --no-daemon --no-configuration-cache
          - name: NeoForge 26.1.2
            java: '25'
            working-directory: neoforge-26.1.2
            command: ./gradlew build --no-daemon --no-configuration-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify version
        working-directory: ${{ matrix.working-directory }}
        run: |
          chmod +x ./gradlew
          ${{ matrix.command }}
