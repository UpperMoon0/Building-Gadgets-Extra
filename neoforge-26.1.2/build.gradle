plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

def sharedProperties = new Properties()
file('../gradle.properties').withInputStream { sharedProperties.load(it) }

['mod_id', 'mod_name', 'mod_license', 'mod_version', 'mod_authors', 'mod_description',
 'mod_url', 'mod_issues_url', 'mod_group_id'].each { propertyName ->
    ext.set(propertyName, sharedProperties.getProperty(propertyName))
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven { url = 'https://www.cursemaven.com' }
}

base {
    archivesName = "building-gadgets-extra-neoforge-${minecraft_version}"
}

sourceSets {
    main {
        java.srcDir file('../common/src/main/java')
        resources.srcDir file('../common/src/main/resources')
    }
    test {
        java.srcDir file('../common/src/versionTest/java')
    }
    clientIntegrationTest {
        java.srcDir file('../common/src/clientIntegrationTest/java')
        java.srcDir file('../common/src/clientIntegrationModern/java')
        java.srcDir file('src/clientIntegrationTest/java')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    clientIntegrationTestImplementation.extendsFrom implementation
    clientIntegrationTestRuntimeOnly.extendsFrom runtimeOnly
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        clientIntegrationTest {
            client()
            gameDirectory = project.file('run-client-integration')
            systemProperty 'bge.clientIntegrationTest', 'true'
            systemProperty 'bge.clientIntegrationResultDir', project.file('build/client-integration').absolutePath
            programArguments = ['--quickPlayMultiplayer', '127.0.0.1:25565']
        }
        clientIntegrationTestServer {
            server()
            gameDirectory = project.file('run-client-integration-server')
            systemProperty 'bge.clientIntegrationTest', 'true'
            systemProperty 'bge.clientIntegrationResultDir', project.file('build/client-integration').absolutePath
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.clientIntegrationTest)
        }
    }
}

dependencies {
    implementation 'curse.maven:building-gadgets-298187:7964119'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'bge.moduleDir', projectDir.absolutePath
    systemProperty 'bge.minecraftVersion', minecraft_version
    systemProperty 'bge.loader', 'neoforge'
    systemProperty 'bge.legacyCut', 'false'
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range        : minecraft_version_range,
            neo_version                    : neo_version,
            loader_version_range           : loader_version_range,
            mod_id                         : mod_id,
            mod_name                       : mod_name,
            mod_license                    : mod_license,
            mod_version                    : mod_version,
            mod_authors                    : mod_authors,
            mod_description                : mod_description,
            mod_url                        : mod_url,
            mod_issues_url                 : mod_issues_url,
            building_gadgets_version_range : building_gadgets_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
